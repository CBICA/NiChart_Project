name: nichart_dkgp
description: This tool runs DKGP on single subjects.

inputs:
  dlmuse_vol:
    type: file
  demog_csv:
    type: file
  spare_csv:
    type: file

outputs:
  dkgp_out:
    type: dir

mounts:
  dlmuse_vol:
    path_in_container: /input/dlmuse.csv
    mode: ro
  demog_csv:
    path_in_container: /input/demographics.csv
    mode: ro
  spare_csv:
    path_in_container: /input/SPARE.csv
    mode: ro
  dkgp_out:
    path_in_container: /output
    mode: rw

parameters:
  {} # Empty dictionary to signify no parameters

resources: # Used to allocate jobs on the cloud. Please be diligent.
  vcpus: 2
  memory: 14000 # Amount must be in MiB, see https://docs.aws.amazon.com/batch/latest/APIReference/API_ResourceRequirement.html
  gpus: 0

container:
  image: cbica/nichart_dkgp:0.0.1
  command: --csv1 {dlmuse_vol} --csv2 {demog_csv} --csv3 {spare_csv} --out-dir {dkgp_out}
