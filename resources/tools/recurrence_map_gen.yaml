name: recurrence_map_gen
description: This tool takes preprocessed input and generates glioblastoma recurrence maps.

inputs:
  preprocessing_results:
    type: directory

outputs:
  recurrence_map_out:
    type: directory

mounts:
  preprocessing_results:
    path_in_container: /input
    mode: ro
  recurrence_map_out:
    path_in_container: /output
    mode: rw

parameters:
  {} # Empty dictionary to signify no parameters

resources: # Used to allocate jobs on the cloud. Please be diligent.
  vcpus: 4
  memory: 28000 # Amount must be in MiB, see https://docs.aws.amazon.com/batch/latest/APIReference/API_ResourceRequirement.html
  gpus: 1

container:
  image: cbica/recurrence_map_gen_pipeline:0.0.1
  command: --input {preprocessing_results} --output {recurrence_map_out}
