name: ithresolve_gbm
description: This tool produces tumor composition (methylation classes) from epigenetic arrays


inputs:
  idat_dir:
    type: directory
  
outputs: 
  output_dir:
    type: directory

mounts:
  idat_dir:
    path_in_container: /input
    mode: ro
  output_dir:
    path_in_container: /output
    mode: rw

parameters:
  {} # Empty dictionary to signify no parameters

resources: # Used to allocate jobs on the cloud. Please be diligent.
  vcpus: 4
  memory: 14000 # Amount must be in MiB, see https://docs.aws.amazon.com/batch/latest/APIReference/API_ResourceRequirement.html
  gpus: 0

container:
  image: sm3kon/gbm-deconv:0.2.0
  command: --input {idat_dir} --output {output_dir}
