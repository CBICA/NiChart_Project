# Variable group definitions for data visualization
# Defines groups of variables that can be used together in visualizations, such as all SPARE scores or all MUSE ROIs.

group_demog-all:
  label: Demographics
  category: demog
  pipeline: []
  vtype: name
  values: [Age, Sex]

group_demog-age:
  label: Age
  category: demog
  pipeline: []
  vtype: name
  values: [Age]

group_cat-vars:
  label: Categorical Variables
  category: demographic
  pipeline: []
  vtype: name
  values: [Sex, DX, DX_AD]

group_spare-scores:
  label: SPARE Scores
  desc: SPARE neuropsychiatric and brain age scores (AD, brain age)
  category: biomarker
  pipeline: [spare]
  vtype: name
  values: [SPARE_AD_RAW, SPARE_AD_Harmonized, SPARE_BA_RAW, SPARE_BA_Harmonized]

group_spare-cvm-scores:
  label: SPARE CVM Scores
  desc: SPARE cardiovascular/metabolic risk scores
  category: biomarker
  pipeline: [spare_cvm]
  vtype: name
  values: [SPARE_DIABETES, SPARE_HYPERTENSION, SPARE_OBESITY, SPARE_SMOKING]

group_surrealgan-scores:
  label: SurrealGAN Scores
  desc: SurrealGAN brain subtype scores (5 components)
  category: biomarker
  pipeline: [surreal_gan]
  values: [SurrealGAN_r1, SurrealGAN_r2, SurrealGAN_r3, SurrealGAN_r4, SurrealGAN_r5]

group_cclnmf-scores:
  label: CCL-NMF Scores
  desc: CCL-NMF brain subtypes scores (7 components)
  category: biomarker
  pipeline: [cclnmf]
  values: [CCL_NMF1, CCL_NMF2, CCL_NMF3, CCL_NMF4, CCL_NMF5, CCL_NMF6, CCL_NMF7]

group_dlmuse-vol:
  label: DLMUSE Volumes
  desc: Volumes of ROIs segmented using DLMUSE
  category: roi
  pipeline: [dlmuse]
  prefix: DL_MUSE_Volume_

group_dlwmls-vol:
  label: DLWMLS Volumes
  desc: Volumes of WM lesions in DLMUSE ROIs segmented using DLWMLS
  category: roi
  pipeline: [dlwmls]
  prefix: DL_WMLS_Volume_
