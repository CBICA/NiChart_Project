# Expected data structure for a NiChart project (output folder for a specific project)
# Describes all files, including images and CSVs, with their expected file paths. 
# This is used for validating the project structure

t1:
  type: img
  desc: T1-weighted anatomical MRI scans
  file: t1/{mrid}_T1.nii.gz

fl:
  type: img
  desc: FLAIR MRI scans
  file: fl/{mrid}_FL.nii.gz

dlmuse-seg:
  type: img
  desc: DLMUSE segmentation images
  file: dlmuse-seg/{mrid}_T1_DLMUSE.nii.gz

dlwmls-seg:
  type: img
  desc: DLWMLS segmentation images
  file: dlwmls-seg/{mrid}_FL_DLWMLS.nii.gz

ravens:
  type: img
  desc: RAVENS maps (voxel-wise volumetric maps normalized by intracranial volume)
  file: ravens/{mrid}_Label_CSF_RAVENS_ICVNorm_zScored_inSubj.nii.gz

participants:
  type: csv
  desc: Basic participant demographics
  file: participants/participants.csv

participants-extended:
  type: csv
  desc: Extended participant clinical data
  file: participants/participants_extended.csv

dlmuse-vol:
  type: csv
  desc: DLMUSE brain region volumes (237 ROIs)
  file: dlmuse-vol/dlmuse-vol.csv

dlwmls-vol:
  type: csv
  desc: DLWMLS white matter lesion volumes per brain region (143 ROIs)
  file: dlwmls-vol/dlwmls-vol.csv

spare-scores:
  type: csv
  desc: SPARE neuropsychiatric and brain age scores (AD, brain age, MDD, SCZ)
  file: ml-biomarkers/spare-scores.csv

sparecvm-scores:
  type: csv
  desc: SPARE cardiovascular/metabolic risk scores
  file: ml-biomarkers/sparecvm-scores.csv

cclnmf-scores:
  type: csv
  desc: CCL-NMF brain subtypes scores (7 components)
  file: ml-biomarkers/cclnmf-scores.csv

surrealgan-scores:
  type: csv
  desc: SurrealGAN brain subtype scores (5 components)
  file: ml-biomarkers/surrealgan-scores.csv
